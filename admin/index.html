<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thukilinam Admin | Management Console</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Great+Vibes&family=Italianno&family=Playball&family=Alex+Brush&family=Pinyon+Script&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
      :root {
        --primary-purple: #6A38B6;
        --electric-blue: #3B82F6;
        --bg-light: #f8f9fc;
        --text-gradient: linear-gradient(135deg, #6A38B6 0%, #3B82F6 100%);
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-light);
      }
      h1, h2, h3, h4, h5, h6, .fw-bold {
        font-family: 'Outfit', sans-serif;
      }
      .text-gradient {
        background: var(--text-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .bg-primary { background: var(--text-gradient) !important; }
      .btn-primary { 
        background: var(--text-gradient); 
        border: none;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(106, 56, 182, 0.3);
      }
      .bg-primary-soft { background-color: rgba(106, 56, 182, 0.1); }
      .bg-info-soft { background-color: rgba(59, 130, 246, 0.1); }
      .bg-warning-soft { background-color: rgba(245, 158, 11, 0.1); }
      .bg-success-soft { background-color: rgba(16, 185, 129, 0.1); }
      .bg-secondary-soft { background-color: rgba(100, 116, 139, 0.1); }
      .cursor-pointer { cursor: pointer; }
      .hover-opacity:hover { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
